    children:
      - title: MCP 服务器
        url: /06-advanced/mcp
      - title: Skills 功能
        url: /06-advanced/skills
      - title: WebSearch 功能
        url: /06-advanced/websearch

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
