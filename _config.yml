# Site settings
title: AI Agent 使用指南
description: 全面的 AI Agent 使用教程 - Claude Code, Codex, Gemini, Grok
baseurl: ""
url: "https://HecreReed.github.io"

# Theme settings
theme: minima

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Navigation structure
navigation:
  - title: 首页
    url: /
  - title: 入门篇
    url: /01-introduction/
    children:
      - title: 什么是 AI Agent
        url: /01-introduction/what-is-ai-agent
      - title: 准备工作
        url: /01-introduction/getting-started
      - title: 基础概念
        url: /01-introduction/basic-concepts
  - title: Claude Code 篇
    url: /02-claude-code/
  - title: Codex 篇
    url: /03-codex/
  - title: Gemini 篇
    url: /04-gemini/
  - title: Grok 篇
    url: /05-grok/
  - title: 进阶与对比篇
    url: /06-advanced/
  - title: 实战项目篇
    url: /07-projects/
  - title: 资源与附录
    url: /08-resources/
  - title: 完整大纲
    url: /outline
  - title: 编写指南
    url: /writing-guide

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
