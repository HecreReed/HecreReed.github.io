# Site settings
title: AI Agent 使用指南
description: 全面的 AI Agent 使用教程 - Claude Code, Codex, Gemini, Grok
baseurl: ""
url: "https://HecreReed.github.io"

# Theme settings
remote_theme: just-the-docs/just-the-docs

# Color scheme
color_scheme: dark

# Logo
# logo: "/assets/images/logo.png"

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Heading anchor links
heading_anchors: true

# Aux links (top right)
aux_links:
  "GitHub":
    - "https://github.com/HecreReed/HecreReed.github.io"

# Footer
footer_content: "Copyright &copy; 2026 HecreReed. 使用 Just the Docs 主题构建。"

# Back to top link
back_to_top: true
back_to_top_text: "返回顶部"

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme

# Navigation
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
