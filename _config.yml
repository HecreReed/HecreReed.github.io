# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Navigation structure
navigation:
  - title: 首页
    url: /
  - title: 入门篇
    url: /01-introduction/
    children:
      - title: 什么是 AI Agent
        url: /01-introduction/what-is-ai-agent
      - title: 准备工作
        url: /01-introduction/getting-started
      - title: 基础概念
        url: /01-introduction/basic-concepts
  - title: Claude Code 篇
    url: /02-claude-code/
    children:
      - title: 简介
        url: /02-claude-code/introduction
      - title: 安装与配置
        url: /02-claude-code/installation
      - title: 基础使用
        url: /02-claude-code/basic-usage
      - title: 高级功能
        url: /02-claude-code/advanced-features
      - title: 最佳实践
        url: /02-claude-code/best-practices
  - title: Codex 篇
    url: /03-codex/
    children:
      - title: 简介
        url: /03-codex/introduction
      - title: API 使用
        url: /03-codex/api-usage
      - title: 实战技巧
        url: /03-codex/tips-and-tricks
  - title: Gemini 篇
    url: /04-gemini/
    children:
      - title: 简介
        url: /04-gemini/introduction
      - title: Nano Banana
        url: /04-gemini/nano-banana
  - title: Grok 篇
    url: /05-grok/
    children:
      - title: 简介
        url: /05-grok/introduction
  - title: 进阶与对比篇
