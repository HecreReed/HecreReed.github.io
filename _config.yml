baseurl: ""
url: "https://HecreReed.github.io"

# Theme settings
theme: jekyll-theme-cayman
# Alternative themes you can try:
# theme: minima
# remote_theme: just-the-docs/just-the-docs

# Build settings
markdown: kramdown
plugins:
