<ul class="nav-list">
{% for item in site.navigation %}
    <li class="nav-item{% if item.children %} has-children{% endif %}{% if page.url == item.url %} active{% endif %}">
        <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {% if item.children %}
            <ul class="nav-children">
            {% for child in item.children %}
                <li class="nav-child{% if page.url == child.url %} active{% endif %}">
                    <a href="{{ child.url | relative_url }}">{{ child.title }}</a>
                </li>
            {% endfor %}
            </ul>
        {% endif %}
    </li>
{% endfor %}
</ul>
